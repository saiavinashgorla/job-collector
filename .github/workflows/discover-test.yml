name: Test Employer Discovery

on:
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery self-test
        run: python src/discover_employers.py --self-test

      - name: Dry run discovery on 20 employers
        run: |
          python src/discover_employers.py \
            config/employers.csv \
            --verification output/employer_verification.json \
            --include-failed \
            --limit 20
