name: Verify Employer ATS Mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify ALL mapped Workday and Oracle candidates
        run: python src/verify_employers.py --input config/employers.csv --output-dir output --scope candidates --workers 6

      - name: Commit verification reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/employer_verification.json output/employer_verification.csv
          if git diff --cached --quiet; then
            echo "No verification output changes to commit"
          else
            git commit -m "Verify all employer ATS mappings"
            git push
          fi
