name: Job Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5,9,13,17 * * 1-5"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python src/collect.py

      - name: Commit collector output
        run: |
          git config user.name "job-collector-bot"
          git config user.email "job-collector-bot@users.noreply.github.com"

          git add output/latest_candidates.json output/latest_coverage.json state/seen_jobs.json

          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi

          git commit -m "Update job collector output"
          git pull --rebase origin main
          git push origin main
