name: Job Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6,12,17 * * 1-5"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python src/collect.py

      - name: Commit collector output
        run: |
          git config user.name "job-collector-bot"
          git config user.email "job-collector-bot@users.noreply.github.com"

          git add output/

          git diff --cached --quiet || git commit -m "Update job collector output"

          git push
