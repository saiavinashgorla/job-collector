name: Discover Greenhouse Employers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-greenhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Greenhouse discovery
        run: |
          python src/discover_greenhouse.py \
            config/employers.csv \
            --write output/employers_greenhouse_staged.csv \
            --report output/greenhouse_discovery.json

      - name: Upload Greenhouse results
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-discovery-results
          path: |
            output/employers_greenhouse_staged.csv
            output/greenhouse_discovery.json
          retention-days: 7
